[package]
name = "daml-rust-codegen"
version = "0.1.0"
edition = "2024"
description = "Generate Rust types from Daml DAR packages for use with the Canton Ledger API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gyorgybalazsi/daml-rust-codegen"
readme = "README.md"

[dependencies]
prost = { version = "0.14.6", features = ["derive"] }
zip = "9.6.0"
anyhow = "1.0.98"
# Shared Ledger API bindings and Daml type representations from the toolbox.
ledger-api = { git = "https://github.com/gyorgybalazsi/canton-event-graph-syncer", rev = "170bbdbcfad857a050b58bebbb182982e81653c0" }
daml-type-rep = { git = "https://github.com/gyorgybalazsi/canton-event-graph-syncer", rev = "170bbdbcfad857a050b58bebbb182982e81653c0" }
proc-macro2 = "1.0.101"
quote = "1.0.40"
syn = "3.0.10"
prettyplease = "0.3.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5.40", features = ["derive"] }

[build-dependencies]
prost = { version = "0.14.6", features = ["derive"] }
prost-build = "0.14.6"
prost-types = "0.14.6"
zip = "9.6.0"

[features]
no-generated = []
