# Dependabot: weekly, grouped version updates. Security updates are
# raised separately as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The rust-toolchain action's tag is the pinned Rust version, kept in sync
    # with rust-toolchain.toml by hand. Dependabot reads it as an action
    # version and bumps it to toolchains that don't exist.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      github-actions:
        patterns: ["*"]
